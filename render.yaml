# Render Blueprint — deploy TaleLah backend with one click.
# Render Dashboard → New → Blueprint → pick this repo → it reads this file.
# CD pipeline then redeploys via the service's Deploy Hook (RENDER_DEPLOY_HOOK secret).
services:
  - type: web
    name: talelah-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: staging
      - key: DEBUG
        value: "false"
      - key: DASHSCOPE_API_KEY
        sync: false # set in Render dashboard — never committed
      - key: SARVAM_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: "" # Malay TTS disabled in cloud unless a secret file is mounted
