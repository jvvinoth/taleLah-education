name: CD — Deploy TaleLah

# Deployment target: Railway (both services), so every completed sprint
# is instantly testable on live URLs.
#
# Primary path: Railway's native GitHub integration auto-deploys each
# service on push to main (backend root = repo root, web root = app/).
# This workflow is the explicit CI-driven fallback: it runs `railway up`
# only when the RAILWAY_TOKEN secret is set. If you rely on Railway's
# auto-deploy, simply leave the secret unset to avoid double deploys.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'app/**'
      - 'Dockerfile'
      - '.github/workflows/cd-deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-railway:
    runs-on: ubuntu-latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy backend to Railway
        if: env.RAILWAY_TOKEN != ''
        run: |
          npm install -g @railway/cli
          railway up --service talelah-backend --detach
          echo "✅ Backend deploy triggered on Railway"

      - name: Deploy Flutter web to Railway
        if: env.RAILWAY_TOKEN != ''
        run: |
          railway up --service talelah-web --path-as-root app --detach
          echo "✅ Web deploy triggered on Railway"

      - name: Skip notice
        if: env.RAILWAY_TOKEN == ''
        run: echo "⏭️  RAILWAY_TOKEN not set — assuming Railway native GitHub auto-deploy handles main pushes"
