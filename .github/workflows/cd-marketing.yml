name: CD — Deploy marketing site

# Deployment target: Cloudflare Pages (project "talelah").
# Builds the Astro marketing site in marketing/ and publishes marketing/dist.
#
# Requires two repo secrets to actually deploy:
#   CLOUDFLARE_API_TOKEN  — custom token with Account → Cloudflare Pages → Edit
#   CLOUDFLARE_ACCOUNT_ID — from the Cloudflare dashboard URL
# Until they are set the build still runs as a type/build gate and the deploy
# step is skipped, so the workflow stays green instead of failing red.

on:
  push:
    branches: [main]
    paths:
      - 'marketing/**'
      - '.github/workflows/cd-marketing.yml'
  pull_request:
    paths:
      - 'marketing/**'
  workflow_dispatch:

concurrency:
  group: marketing-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: marketing

env:
  PROJECT_NAME: talelah
  # Pinned so a wrangler major bump can never break a deploy unannounced.
  WRANGLER: wrangler@3.90.0

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: marketing/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check content contract
        run: npm run check

      - name: Build static site
        run: npm run build

      # `pages deploy` will not create a missing project non-interactively,
      # so make sure it exists first. Idempotent: safe on every run.
      - name: Ensure Cloudflare Pages project exists
        id: ensure
        if: github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx --yes $WRANGLER pages project list | grep -qw "$PROJECT_NAME"; then
            echo "✅ Pages project '$PROJECT_NAME' already exists"
          else
            echo "➕ Creating Pages project '$PROJECT_NAME'"
            npx --yes $WRANGLER pages project create "$PROJECT_NAME" \
              --production-branch=main
          fi

      # Deployed with npx rather than wrangler-action, which installs wrangler
      # into marketing/ and dirties package.json / package-lock.json.
      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.ensure.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes $WRANGLER pages deploy dist \
            --project-name="$PROJECT_NAME" \
            --branch=main \
            --commit-dirty=true

      - name: Skip notice
        if: steps.ensure.outcome == 'skipped'
        run: echo "⏭️  Cloudflare secrets not set (or not on main) — build verified, deploy skipped"
