name: CD — Deploy marketing site

# Deployment target: Cloudflare Pages (project "talelah").
# Builds the Astro marketing site in marketing/ and publishes marketing/dist.
#
# Requires two repo secrets to actually deploy:
#   CLOUDFLARE_API_TOKEN  — custom token with Account → Cloudflare Pages → Edit
#   CLOUDFLARE_ACCOUNT_ID — from the Cloudflare dashboard URL
# Until they are set the build still runs as a type/build gate and the deploy
# step is skipped, so the workflow stays green instead of failing red.

on:
  push:
    branches: [main]
    paths:
      - 'marketing/**'
      - '.github/workflows/cd-marketing.yml'
  pull_request:
    paths:
      - 'marketing/**'
  workflow_dispatch:

concurrency:
  group: marketing-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: marketing

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: marketing/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check content contract
        run: npm run check

      - name: Build static site
        run: npm run build

      # Deploy only from main, and only once the Cloudflare secrets exist.
      - name: Deploy to Cloudflare Pages
        id: deploy
        if: github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: marketing
          command: pages deploy dist --project-name=talelah --branch=main

      - name: Skip notice
        if: steps.deploy.outcome == 'skipped'
        run: echo "⏭️  Cloudflare secrets not set (or not on main) — build verified, deploy skipped"
