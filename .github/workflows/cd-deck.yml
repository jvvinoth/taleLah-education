name: CD — Deploy pitch deck

# Deployment target: Cloudflare Pages (project "talelah-deck").
# Publishes deck/ as-is — it is a single self-contained HTML file with two
# local images, so there is nothing to build.
#
# Reuses the same two repo secrets as the marketing site:
#   CLOUDFLARE_API_TOKEN  — custom token with Account → Cloudflare Pages → Edit
#   CLOUDFLARE_ACCOUNT_ID — from the Cloudflare dashboard URL
# Without them the asset check still runs as a gate and the deploy step is
# skipped, so the workflow stays green instead of failing red.

on:
  push:
    branches: [main]
    paths:
      - 'deck/**'
      - '.github/workflows/cd-deck.yml'
  pull_request:
    paths:
      - 'deck/**'
  workflow_dispatch:

concurrency:
  group: deck-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: deck

env:
  PROJECT_NAME: talelah-deck
  # Pinned so a wrangler major bump can never break a deploy unannounced.
  WRANGLER: wrangler@3.90.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      # There is no build to catch mistakes, so this stands in for one: a deck
      # whose mascot or favicon 404s would otherwise deploy perfectly happily.
      - name: Check deck assets resolve
        run: |
          test -f index.html || { echo "::error::deck/index.html is missing"; exit 1; }
          missing=0
          refs=$(grep -oE '(src|href)="[^"]+"' index.html \
                 | sed -E 's/^[a-z]+="//; s/"$//' \
                 | grep -vE '^(https?:|//|#|data:|mailto:)' \
                 | sed 's/[?#].*$//' | sort -u)
          for ref in $refs; do
            if [ ! -f "$ref" ]; then
              echo "::error file=deck/index.html::referenced asset not found: $ref"
              missing=1
            else
              echo "✅ $ref"
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      # `pages deploy` will not create a missing project non-interactively,
      # so make sure it exists first. Idempotent: safe on every run.
      #
      # Matched between delimiters rather than with `grep -w`: "talelah" is a
      # whole word inside "talelah-deck", so a loose match would let one
      # project vouch for the other's existence.
      - name: Ensure Cloudflare Pages project exists
        id: ensure
        if: github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if npx --yes $WRANGLER pages project list \
             | grep -qE "(^|[[:space:]|])${PROJECT_NAME}([[:space:]|]|$)"; then
            echo "✅ Pages project '$PROJECT_NAME' already exists"
          else
            echo "➕ Creating Pages project '$PROJECT_NAME'"
            npx --yes $WRANGLER pages project create "$PROJECT_NAME" \
              --production-branch=main
          fi

      # Deployed with npx rather than wrangler-action, to match cd-marketing
      # and to keep wrangler out of the repo.
      - name: Deploy to Cloudflare Pages
        id: deploy
        if: steps.ensure.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes $WRANGLER pages deploy . \
            --project-name="$PROJECT_NAME" \
            --branch=main \
            --commit-dirty=true

      - name: Skip notice
        if: steps.ensure.outcome == 'skipped'
        run: echo "⏭️  Cloudflare secrets not set (or not on main) — assets verified, deploy skipped"
