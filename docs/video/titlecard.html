<!doctype html><html><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{width:1080px;height:1920px;overflow:hidden;font-family:Nunito,-apple-system,sans-serif;
  background:radial-gradient(115% 75% at 50% 30%,#FFFDF7 0%,#F7F1E4 55%,#EFE7D6 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:#0F1C18;text-align:center;position:relative;}
.halo{position:absolute;width:840px;height:840px;top:11%;left:50%;transform:translateX(-50%);
  background:radial-gradient(circle,rgba(47,158,151,.20) 0%,transparent 64%);filter:blur(38px);}
.wrap{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;margin-top:40px;}
.sg{display:inline-flex;align-items:center;gap:18px;background:rgba(255,255,255,.75);
  border:2px solid rgba(15,28,24,.09);border-radius:999px;padding:15px 32px 15px 20px;
  font-size:29px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#5D6B7A;
  box-shadow:0 8px 26px rgba(15,28,24,.07);}
.mina{width:250px;height:250px;border-radius:50%;background:#fff;padding:16px;margin-top:58px;
  box-shadow:0 26px 66px rgba(15,28,24,.17);}
h1{font-size:140px;font-weight:900;letter-spacing:-.035em;margin-top:46px;line-height:1;color:#0F1C18;}
.tag{font-size:46px;font-weight:800;color:#2F9E97;margin-top:24px;line-height:1.32;}
.sub{font-size:33px;font-weight:700;color:#5D6B7A;margin-top:40px;line-height:1.45;max-width:20ch;}
.rule{width:132px;height:5px;border-radius:3px;background:rgba(15,28,24,.14);margin:76px 0 54px;}
.built{font-size:25px;font-weight:800;letter-spacing:.30em;text-transform:uppercase;color:#9AA7B2;}
.logos{display:flex;align-items:center;gap:44px;margin-top:34px;}
.logos img.q{height:72px;}
.ali{display:inline-flex;align-items:center;gap:15px;}
.ali img{height:50px;}
.ali span{font-size:42px;font-weight:800;color:#FF6A00;letter-spacing:-.01em;}
.sep{width:2px;height:54px;background:rgba(15,28,24,.16);}
</style></head><body>
